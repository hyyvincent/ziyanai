<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你植物保卫战</title>
  <style>
    :root{--ink:#263126;--cream:#fff0bd;--green:#58a84f;--dark:#275b32;--sun:#ffd34e;--brown:#8b5a34}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 0,#e7f8ff 0,#91d5f3 34%,#5f9f48 35%,#315f31 100%);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
    .game{width:min(1080px,100%);padding:14px;border:5px solid #4c321e;border-radius:24px;background:linear-gradient(135deg,#fff6ce,#e9ce8b);box-shadow:0 5px 0 #2b1d13,0 18px 40px rgba(23,44,24,.42),inset 0 2px 0 rgba(255,255,255,.8)}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    h1{margin:0;font-size:clamp(24px,4vw,38px);color:#36733b;letter-spacing:.05em;text-shadow:0 2px 0 #fff7ca,0 4px 0 rgba(52,82,39,.18)}
    .stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-weight:900}
    .badge{padding:8px 12px;border:3px solid #543923;border-radius:999px;background:linear-gradient(#fffbe8,#ead59e);min-width:100px;text-align:center;box-shadow:inset 0 2px 0 #fff,0 3px 0 #6d482a}
    .music-button,.collect-button,.energy-button{cursor:pointer;font:inherit;font-weight:900;color:var(--ink)}
    .music-button.off{background:#e5e5e5;color:#716d68}
    .collect-button:disabled,.energy-button:disabled{cursor:not-allowed;filter:grayscale(.7);opacity:.62;box-shadow:inset 0 2px 0 #fff,0 2px 0 #6d482a;transform:translateY(1px)}
    .energy-button{background:linear-gradient(#fff3c2,#86e7ff);color:#174d76}.energy-button.active{background:linear-gradient(#fff7a5,#ff9d38);animation:pulse .65s infinite alternate}@keyframes pulse{to{filter:brightness(1.18);transform:translateY(-1px)}}
    .toolbar{display:flex;gap:10px;align-items:stretch;margin-bottom:10px;overflow-x:auto;padding:3px 3px 8px}
    .plant-card{position:relative;flex:0 0 150px;display:flex;align-items:center;gap:9px;padding:8px;border:3px solid #543923;border-radius:13px;background:linear-gradient(145deg,#fff9d9,#d9bd79);cursor:pointer;font:inherit;text-align:left;box-shadow:inset 0 2px 0 rgba(255,255,255,.85),0 5px 0 #694528;transition:transform .12s,filter .12s}
    .plant-card:hover{transform:translateY(-2px);filter:saturate(1.12)}
    .plant-card.selected{background:linear-gradient(145deg,#f4ffbd,#9fd45a);outline:4px solid #ffd33d;box-shadow:inset 0 2px 0 #fffbd7,0 5px 0 #6b792d}
    .plant-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
    .icon{display:grid;place-items:center;width:44px;height:44px;border:2px solid rgba(65,76,37,.45);border-radius:10px;font-size:29px;background:radial-gradient(circle at 35% 25%,#fffbd4,#a9d16e);box-shadow:inset 0 2px 4px rgba(255,255,255,.9),0 2px 3px rgba(64,45,24,.25)}
    .plant-card strong,.plant-card small{display:block}.plant-card small{color:#6b6359;margin-top:3px}
    .stage{position:relative;overflow:hidden;border:5px solid #4a301e;border-radius:16px;background:#70ad54;box-shadow:inset 0 0 0 2px #b7844c,0 6px 0 #2c1d14,0 12px 24px rgba(30,46,24,.3);touch-action:none}
    canvas{display:block;width:100%;height:auto;aspect-ratio:3/2}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(25,40,31,.76);transition:opacity .2s}
    .overlay.hidden{opacity:0;pointer-events:none}
    .panel{width:min(440px,100%);padding:25px;border:4px solid var(--ink);border-radius:18px;background:var(--cream);text-align:center;box-shadow:8px 8px 0 rgba(0,0,0,.25)}
    .panel h2{margin:0 0 10px;color:var(--dark);font-size:31px}.panel p{line-height:1.7}
    #startButton{padding:11px 24px;border:3px solid var(--ink);border-radius:11px;background:var(--sun);font:inherit;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
    .help{text-align:center;margin-top:10px;font-size:14px;font-weight:700;color:#4f5e53}
    @media(max-width:650px){body{padding:6px}.game{padding:8px;border-width:3px}header{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}.badge{min-width:88px;padding:6px 9px}.plant-card{flex-basis:137px}}
  </style>
</head>
<body>
  <main class="game">
    <header>
      <h1>🌱 迷你植物保卫战</h1>
      <div class="stats">
        <div class="badge">☀️ 阳光 <span id="sunCount">300</span></div>
        <div class="badge">🏆 得分 <span id="score">0</span></div>
        <div class="badge">🧟 剩余 <span id="remaining">19</span></div>
        <button class="badge energy-button" id="energyButton">🫘 能量豆 1/3</button>
        <button class="badge collect-button" id="collectButton">✨ 一键收集</button>
        <button class="badge music-button" id="musicButton">🎵 音乐：开</button>
      </div>
    </header>

    <div class="toolbar">
      <button class="plant-card selected" data-plant="shooter">
        <span class="icon">🌿</span><span><strong>豌豆射手</strong><small>☀️ 100</small></span>
      </button>
      <button class="plant-card" data-plant="sunflower">
        <span class="icon">🌻</span><span><strong>向日葵</strong><small>☀️ 50</small></span>
      </button>
      <button class="plant-card" data-plant="wallnut">
        <span class="icon">🌰</span><span><strong>坚果墙</strong><small>☀️ 75 · 高防御</small></span>
      </button>
      <button class="plant-card" data-plant="gatling">
        <span class="icon">🫛</span><span><strong>机枪射手</strong><small>☀️ 200 · 四连发</small></span>
      </button>
      <button class="plant-card" data-plant="electricPea">
        <span class="icon">⚡</span><span><strong>电击豌豆</strong><small>☀️ 225 · 穿透伤害</small></span>
      </button>
      <button class="plant-card" data-plant="torchwood">
        <span class="icon">🔥</span><span><strong>火炬树桩</strong><small>☀️ 175 · 强化豌豆</small></span>
      </button>
      <button class="plant-card" data-plant="chili">
        <span class="icon">🌶️</span><span><strong>火爆辣椒</strong><small>☀️ 125 · 整行爆炸</small></span>
      </button>
      <button class="plant-card" data-plant="cherry">
        <span class="icon">🍒</span><span><strong>樱桃炸弹</strong><small>☀️ 150 · 3×3爆炸</small></span>
      </button>
      <button class="plant-card" data-plant="doomShroom">
        <span class="icon">🍄</span><span><strong>毁灭菇</strong><small>☀️ 500 · Boss伤害5000</small></span>
      </button>
      <button class="plant-card" data-plant="shovel">
        <span class="icon">🪏</span><span><strong>小铲子</strong><small>移除植物</small></span>
      </button>
    </div>

    <div class="stage">
      <canvas id="gameCanvas" width="900" height="600" aria-label="植物保卫战游戏草坪"></canvas>
      <div class="overlay" id="overlay">
        <section class="panel">
          <h2 id="messageTitle">守住花园！</h2>
          <p id="messageText">Boss会从开局出现，在右侧上下移动并持续召唤僵尸。没有固定出场顺序，准备好后立即迎战！</p>
          <button id="startButton">开始游戏</button>
        </section>
      </div>
    </div>
    <div class="help">⚡电击豌豆可穿透　｜　与机枪射手种在同一格可融合　｜　🫘能量豆可启动扇形超级大招</div>
  </main>

  <script>
    "use strict";
    const canvas=document.querySelector("#gameCanvas"),ctx=canvas.getContext("2d");
    const LOGICAL_WIDTH=900,LOGICAL_HEIGHT=600,PIXEL_RATIO=Math.min(window.devicePixelRatio||1,2);
    canvas.width=LOGICAL_WIDTH*PIXEL_RATIO;canvas.height=LOGICAL_HEIGHT*PIXEL_RATIO;
    ctx.setTransform(PIXEL_RATIO,0,0,PIXEL_RATIO,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
    const sunEl=document.querySelector("#sunCount"),scoreEl=document.querySelector("#score"),remainingEl=document.querySelector("#remaining");
    const overlay=document.querySelector("#overlay"),titleEl=document.querySelector("#messageTitle"),textEl=document.querySelector("#messageText"),startButton=document.querySelector("#startButton");
    const musicButton=document.querySelector("#musicButton"),collectButton=document.querySelector("#collectButton"),energyButton=document.querySelector("#energyButton");
    const cards=[...document.querySelectorAll(".plant-card")];

    // ===== 初学者修改区 =====
    const ROWS=5,COLS=9,TOTAL_ZOMBIES=15,GIANT_COUNT=3;
    const STARTING_SUN=300,ZOMBIE_SPEED=9;
    const SHOOTER_COST=100,SUNFLOWER_COST=50,WALLNUT_COST=75,GATLING_COST=200,ELECTRIC_PEA_COST=225,TORCHWOOD_COST=175,CHILI_COST=125,CHERRY_COST=150,DOOM_SHROOM_COST=500;
    // ========================
    const field={x:90,y:75,w:810,h:500},cellW=field.w/COLS,cellH=field.h/ROWS;
    let plants=[],zombies=[],peas=[],suns=[],particles=[];
    let sun=STARTING_SUN,score=0,spawned=0,defeated=0,bossSpawned=false,giantsDefeated=0,finalBossSpawned=false,finalBossDefeated=false,screenFlash=0,selected="shooter",running=false,lastTime=0,nextSpawn=0,nextSkySun=0,animationId,energyBeans=1,plantPowerUntil=0;
    let audioContext=null,musicTimer=null,musicStep=0,musicOn=true;

    // 使用浏览器合成轻快旋律，不需要额外的音乐文件。
    const melody=[262,330,392,330,294,349,440,349,262,330,392,523,440,392,330,294];
    function playNote(frequency){
      if(!audioContext||!musicOn||!running)return;
      const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
      oscillator.type="triangle";oscillator.frequency.value=frequency;
      gain.gain.setValueAtTime(.0001,audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(.045,audioContext.currentTime+.02);
      gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.22);
      oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start();oscillator.stop(audioContext.currentTime+.24)
    }
    function startMusic(){
      if(!musicOn)return;
      if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();
      if(audioContext.state==="suspended")audioContext.resume();
      if(musicTimer)return;
      playNote(melody[musicStep++%melody.length]);
      musicTimer=setInterval(()=>playNote(melody[musicStep++%melody.length]),280)
    }
    function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
    function toggleMusic(){
      musicOn=!musicOn;musicButton.textContent=musicOn?"🎵 音乐：开":"🔇 音乐：关";musicButton.classList.toggle("off",!musicOn);
      if(musicOn&&running)startMusic();else stopMusic()
    }

    function updateHud(){
      sunEl.textContent=sun;scoreEl.textContent=score;
      const futureRegular=Math.max(0,TOTAL_ZOMBIES-spawned),futureGiants=bossSpawned?0:GIANT_COUNT,futureBoss=finalBossSpawned?0:1;
      const active=zombies.filter(z=>z.type!=="imp").length;remainingEl.textContent=Math.max(0,futureRegular+futureGiants+futureBoss+active);
      collectButton.disabled=!running||suns.length===0;collectButton.textContent=suns.length?`✨ 一键收集 ×${suns.length}`:"✨ 一键收集";
      const powered=performance.now()<plantPowerUntil;energyButton.disabled=!running||energyBeans<=0||powered;energyButton.classList.toggle("active",powered);energyButton.textContent=powered?"🔥 能量强化中":`🫘 能量豆 ${energyBeans}/3`
    }
    function resetGame(){plants=[];zombies=[];peas=[];suns=[];particles=[];sun=STARTING_SUN;score=0;spawned=TOTAL_ZOMBIES;defeated=TOTAL_ZOMBIES;bossSpawned=true;giantsDefeated=0;finalBossSpawned=false;finalBossDefeated=false;screenFlash=0;energyBeans=1;plantPowerUntil=0;nextSpawn=Infinity;nextSkySun=performance.now()+1800;updateHud()}
    function plantAt(row,col){return plants.find(p=>p.row===row&&p.col===col)}
    function center(row,col){return{x:field.x+col*cellW+cellW/2,y:field.y+row*cellH+cellH/2}}

    function placePlant(row,col){
      if(selected==="shovel"){plants=plants.filter(p=>p.row!==row||p.col!==col);return}
      const existing=plantAt(row,col),canFuse=existing&&((selected==="electricPea"&&existing.type==="gatling")||(selected==="gatling"&&existing.type==="electricPea"));
      if(existing&&!canFuse)return;
      const costs={shooter:SHOOTER_COST,sunflower:SUNFLOWER_COST,wallnut:WALLNUT_COST,gatling:GATLING_COST,electricPea:ELECTRIC_PEA_COST,torchwood:TORCHWOOD_COST,chili:CHILI_COST,cherry:CHERRY_COST,doomShroom:DOOM_SHROOM_COST},cost=costs[selected];
      if(sun<cost){makeText("阳光不足！",field.x+col*cellW+cellW/2,field.y+row*cellH+30,"#d33");return}
      if(canFuse){sun-=cost;existing.type="superGatling";existing.hp=280;existing.nextAction=performance.now();existing.ultimateUntil=performance.now()+8000;burst(existing.x,existing.y,"#55e9ff",28);makeText("超级电能机枪：大招启动！",existing.x,existing.y-62,"#20aedd");updateHud();return}
      sun-=cost;const c=center(row,col);plants.push({type:selected,row,col,x:c.x,y:c.y,hp:selected==="wallnut"?450:selected==="torchwood"?220:100,nextAction:performance.now()+((selected==="chili"||selected==="cherry"||selected==="doomShroom")?650:1000)});updateHud()
    }
    function spawnZombie(){
      if(spawned>=TOTAL_ZOMBIES)return;
      const row=Math.floor(Math.random()*ROWS),roll=Math.random();let type,hp,speed,extra={};
      if(roll<.10){type="runner";hp=238;speed=23}
      else if(roll<.20){type="medic";hp=476;speed=8.4;extra.healAt=performance.now()+2800}
      else if(roll<.30){type="jumper";hp=392;speed=12.8;extra.jumped=false;extra.jumpUntil=0}
      else if(roll<.40){type="shield";hp=420;speed=8.4;extra.shieldHp=525;extra.maxShieldHp=525}
      else if(roll<.50){type="summoner";hp=420;speed=7.8;extra.summonAt=performance.now()+3500;extra.summonsLeft=2}
      else if(roll<.61){type="berserker";hp=588;speed=10;extra.raging=false}
      else if(roll<.80){type="armored";hp=714;speed=(ZOMBIE_SPEED+Math.random()*3.2)*.87}
      else{type="normal";hp=294;speed=(ZOMBIE_SPEED+Math.random()*3.2)*1.2}
      zombies.push({type,mainWave:true,row,x:930,y:center(row,8).y,hp,maxHp:hp,speed,biteAt:0,...extra});spawned++;updateHud()
    }
    function spawnGiantWave(){
      if(bossSpawned)return;bossSpawned=true;const now=performance.now(),rows=[0,2,4];
      rows.slice(0,GIANT_COUNT).forEach((row,index)=>zombies.push({type:"giant",waveGiant:true,row,x:950+index*65,y:center(row,8).y,hp:2940,maxHp:2940,speed:5,biteAt:0,throwAt:now+3600+index*900,thrown:false}));
      makeText("三巨人首领战！",640,112,"#b51f1f");updateHud()
    }
    function spawnFinalBoss(){
      if(finalBossSpawned)return;finalBossSpawned=true;const row=2,now=performance.now();
      zombies.push({type:"boss",row,x:830,y:center(row,8).y,hp:50000,maxHp:50000,phase:3,speed:0,biteAt:0,summonAt:now+2200,summons:0,verticalSpeed:42,verticalDir:1});
      makeText("Boss开局降临！",640,112,"#7d1a8c");updateHud()
    }
    function bossSummon(boss){
      boss.summons++;boss.summonAt=performance.now()+3600;
      const rows=[0,1,3,4],row=rows[Math.floor(Math.random()*rows.length)],summonGiant=boss.summons%2===0;
      if(summonGiant)zombies.push({type:"giant",waveGiant:false,row,x:930,y:center(row,8).y,hp:2520,maxHp:2520,speed:5.3,biteAt:0,throwAt:performance.now()+4800,thrown:false});
      else if(Math.random()<.6){const types=["runner","medic","jumper","shield","summoner","berserker"],type=types[Math.floor(Math.random()*types.length)],data={runner:[238,23],medic:[476,8.4],jumper:[392,12.8],shield:[420,8.4],summoner:[420,7.8],berserker:[588,10]}[type],extra=type==="medic"?{healAt:performance.now()+2800}:type==="jumper"?{jumped:false,jumpUntil:0}:type==="shield"?{shieldHp:525,maxShieldHp:525}:type==="summoner"?{summonAt:performance.now()+3500,summonsLeft:2}:type==="berserker"?{raging:false}:{};zombies.push({type,mainWave:false,row,x:930,y:center(row,8).y,hp:data[0],maxHp:data[0],speed:data[1],biteAt:0,...extra})}
      else{const armored=Math.random()<.55,hp=armored?714:294;zombies.push({type:armored?"armored":"normal",mainWave:false,row,x:930,y:center(row,8).y,hp,maxHp:hp,speed:(ZOMBIE_SPEED+2)*(armored?.87:1.2),biteAt:0})}
      makeText(summonGiant?"Boss召唤巨人！":"Boss召唤僵尸！",boss.x-80,boss.y-95,"#7d1a8c");updateHud()
    }
    function summonFiveGiants(boss){
      const now=performance.now();
      for(let row=0;row<ROWS;row++)zombies.push({type:"giant",waveGiant:false,row,x:940+row*24,y:center(row,8).y,hp:2520,maxHp:2520,speed:5.3,biteAt:0,throwAt:now+4200+row*350,thrown:false});
      makeText(`Boss进入第${boss.phase}阶段：五路巨人！`,500,115,"#7d1a8c");updateHud()
    }
    function throwImp(giant){
      giant.thrown=true;zombies.push({type:"imp",row:giant.row,x:giant.x-45,y:giant.y-105,targetY:giant.y,hp:147,maxHp:147,speed:22.4,biteAt:0,airborne:true,airTime:.75});
      makeText("投掷小僵尸！",giant.x-30,giant.y-95,"#7b2e28")
    }
    const SPECIAL_ZOMBIES=new Set(["runner","medic","jumper","shield","summoner","berserker"]);
    function awardEnergyBean(z){
      if(!SPECIAL_ZOMBIES.has(z.type))return;if(energyBeans<3){energyBeans++;makeText("获得能量豆！",z.x,z.y-75,"#35bfe8");burst(z.x,z.y,"#7ceaff",18)}else makeText("能量豆已满！",z.x,z.y-75,"#ffe36a");updateHud()
    }
    function useEnergyBean(){
      const now=performance.now();if(!running||energyBeans<=0||now<plantPowerUntil)return;energyBeans--;plantPowerUntil=now+8000;let superCount=0;plants.forEach(p=>{if(["shooter","gatling","electricPea","superGatling"].includes(p.type))p.nextAction=now;if(p.type==="superGatling"){p.ultimateUntil=now+8000;superCount++}});screenFlash=5;makeText(superCount?"能量豆：扇形超级大招！":"能量豆：全场火力强化！",450,125,"#ff7b28");updateHud()
    }
    function defeatZombie(z,index){
      if(z.type==="boss"&&z.phase>1){
        burst(z.x,z.y,"#b642d2");z.phase--;z.hp=50000;z.maxHp=50000;z.summonAt=performance.now()+4500;summonFiveGiants(z);return
      }
      awardEnergyBean(z);burst(z.x,z.y,z.type==="giant"?"#d14d35":z.type==="boss"?"#b642d2":"#875e48");zombies.splice(index,1);
      if(z.type==="boss"){finalBossDefeated=true;score+=3000;updateHud();winGame();return}
      if(z.type==="giant"){score+=1000;if(z.waveGiant){giantsDefeated++;if(giantsDefeated>=GIANT_COUNT)spawnFinalBoss()}updateHud();return}
      if(z.type==="imp"){score+=50;updateHud();return}
      score+=100;if(z.mainWave){defeated++;if(defeated>=TOTAL_ZOMBIES)spawnGiantWave()}updateHud()
    }
    function spawnSun(x=130+Math.random()*690,y=-20,targetY=120+Math.random()*390){suns.push({x,y,targetY,life:9000,value:25,r:23});updateHud()}
    function collectAllSuns(){
      if(!running||suns.length===0)return;const collected=suns.reduce((total,s)=>total+s.value,0),count=suns.length;
      suns.forEach(s=>{burst(s.x,s.y,"#ffdc51");makeText(`+${s.value}`,s.x,s.y,"#8b6120")});sun+=collected;suns=[];makeText(`一键收集：+${collected}阳光`,450,120,"#b8780b");updateHud()
    }
    function makeText(text,x,y,color="#fff"){particles.push({text,x,y,vy:-24,life:1,color})}
    function burst(x,y,color){for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,s=25+Math.random()*80;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7,color,r:2+Math.random()*4})}}
    function applyBombDamage(z){
      if(z.type==="boss")z.hp-=2500;
      else if(z.type==="giant")z.hp-=z.maxHp/2;
      else z.hp=0;
    }
    function hitZombie(z,damage){
      if(z.type==="shield"&&z.shieldHp>0){const blocked=Math.min(z.shieldHp,damage);z.shieldHp-=blocked;damage-=blocked;burst(z.x-18,z.y,"#72c9f2");if(z.shieldHp<=0)makeText("护盾破碎！",z.x,z.y-60,"#3189b8")}
      if(damage>0)z.hp-=damage
    }
    function summonSmallZombie(z){
